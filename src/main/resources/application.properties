# ===================================
# DairyCoopMS - Application Configuration
# ===================================
spring.application.name=DairyCoopMS

# ===================================
# DATABASE
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/dairycoopms?useSSL=false&serverTimezone=Africa/Lusaka&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=dairycoopms

# ===================================
# FLYWAY
# ===================================
spring.flyway.enabled=false

# ===================================
# THYMELEAF
# ===================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===================================
# STATIC RESOURCES
# ===================================
spring.web.resources.add-mappings=true

# ===================================
# SERVER
# ===================================
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# ===================================
# SECURITY
# ===================================
spring.security.user.name=admin
spring.security.user.password=ignored

# ===================================
# LOGGING
# ===================================
logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.dairycoopms.dairycoopms=INFO

# ===================================
# EMAIL
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jacksonmofu2@gmail.com
spring.mail.password=lupmpjcravfgzcsk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================
# APP
# ===================================
app.name=Dairy Cooperative Management System
app.version=1.0
app.default-price-per-liter=1.00
app.coop.name=Dairy Coopms
app.coop.email=jacksonmofu2@gmail.com
app.coop.phone=+260 970 816 607

server.forward-headers-strategy=native