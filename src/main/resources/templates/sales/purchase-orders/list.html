<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Purchase Orders - DairyCoop Sales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ── Shared Sales Topnav (keep identical on every sales/* page) ── */
        .topnav{background:linear-gradient(135deg,#0f2747 0%,#1b3a63 100%);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(15,39,71,0.45);gap:14px}
        .nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
        .nav-logo{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0}
        .nav-title{font-size:17px;font-weight:700;color:#fff;white-space:nowrap}
        .nav-title span{color:rgba(255,255,255,0.9)}
        .nav-links{display:flex;align-items:center;gap:1px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0}
        .nav-links::-webkit-scrollbar{display:none}
        .nav-link{padding:8px 10px;border-radius:8px;color:rgba(255,255,255,0.85);text-decoration:none;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .2s;position:relative;white-space:nowrap;flex-shrink:0}
        .nav-link:hover{background:rgba(255,255,255,0.15);color:#fff}
        .nav-link.active{background:rgba(255,255,255,0.2);color:#fff}
        .nav-link i{font-size:14px}
        .nav-badge{position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:9px;min-width:16px;text-align:center}
        .nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .nav-user{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;background:#f8fafc;border-radius:24px;border:1px solid #e2e8f0;max-width:170px}
        .nav-avatar{width:28px;height:28px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
        .nav-uname{font-size:12.5px;font-weight:500;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .btn-logout{background:none;border:1px solid #fecaca;color:#dc2626;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;flex-shrink:0}
        .btn-logout:hover{background:#fef2f2}
        @media(max-width:1480px){.nav-uname{display:none}.nav-user{max-width:none}}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;min-height:100vh}
        .main{max-width:1400px;margin:32px auto;padding:0 32px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:28px}
        .stat{background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0}
        .stat-label{font-size:12px;color:#64748b;margin-bottom:8px;font-weight:600}
        .stat-value{font-size:28px;font-weight:700;color:#0f172a}
        .card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden}
        .card-head{padding:18px 24px;border-bottom:1px solid #f1f5f9;background:#f8fafc;display:flex;justify-content:space-between;align-items:center}
        .card-title{font-size:16px;font-weight:700;color:#0f172a}
        table{width:100%;border-collapse:collapse}
        thead th{background:#f8fafc;padding:12px 18px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;border-bottom:1px solid #e2e8f0}
        tbody td{padding:16px 18px;border-bottom:1px solid #f1f5f9;font-size:14px}
        tbody tr:hover{background:#f8fafc}
        .badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;display:inline-block}
        .badge-draft{background:#f1f5f9;color:#64748b}
        .badge-submitted{background:#fef3c7;color:#92400e}
        .badge-approved{background:#dcfce7;color:#166534}
        .badge-rejected{background:#fee2e2;color:#991b1b}
        .btn{padding:8px 16px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;display:inline-block;border:none;cursor:pointer}
        .btn-primary{background:#3b82f6;color:#fff}
        .btn-secondary{background:#f1f5f9;color:#475569}
    </style>
</head>
<body>

<div th:replace="~{fragments/sales-nav :: nav(active='purchase-orders')}"></div>

<div class="main">
    <div class="stats">
        <div class="stat">
            <div class="stat-label">Submitted</div>
            <div class="stat-value" th:text="${submittedCount}">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Approved</div>
            <div class="stat-value" th:text="${approvedCount}">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Rejected</div>
            <div class="stat-value" th:text="${rejectedCount}">0</div>
        </div>
    </div>

    <div class="card">
        <div class="card-head">
            <div class="card-title">All Purchase Orders</div>
            <a th:href="@{/sales/dashboard}" class="btn btn-secondary">← Back</a>
        </div>
        <table>
            <thead>
            <tr>
                <th>PO Number</th>
                <th>Company</th>
                <th>Quantity</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="po : ${purchaseOrders}">
                <td><strong th:text="${po.poNumber}">PO-001</strong></td>
                <td th:text="${po.companyName}">Company</td>
                <td th:text="${po.quantityLitres} + ' L'">100 L</td>
                <td th:text="'ZMW ' + ${po.totalAmount}">ZMW 2000</td>
                <td th:text="${po.poDate}">2026-05-17</td>
                <td>
                    <span class="badge badge-draft" th:if="${po.status.name() == 'DRAFT'}">Draft</span>
                    <span class="badge badge-submitted" th:if="${po.status.name() == 'SUBMITTED'}">Submitted</span>
                    <span class="badge badge-approved" th:if="${po.status.name() == 'APPROVED'}">Approved</span>
                    <span class="badge badge-rejected" th:if="${po.status.name() == 'REJECTED'}">Rejected</span>
                </td>
                <td>
                    <a th:href="@{/sales/purchase-orders/{id}/review(id=${po.id})}" class="btn btn-primary">Review</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
