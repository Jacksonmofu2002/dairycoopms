<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - DCMS Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* ── Shared Sales Topnav (keep identical on every sales/* page) ── */
        .topnav{background:linear-gradient(135deg,#0f2747 0%,#1b3a63 100%);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(15,39,71,0.45);gap:14px}
        .nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
        .nav-logo{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0}
        .nav-title{font-size:17px;font-weight:700;color:#fff;white-space:nowrap}
        .nav-title span{color:rgba(255,255,255,0.9)}
        .nav-links{display:flex;align-items:center;gap:1px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0}
        .nav-links::-webkit-scrollbar{display:none}
        .nav-link{padding:8px 10px;border-radius:8px;color:rgba(255,255,255,0.85);text-decoration:none;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .2s;position:relative;white-space:nowrap;flex-shrink:0}
        .nav-link:hover{background:rgba(255,255,255,0.15);color:#fff}
        .nav-link.active{background:rgba(255,255,255,0.2);color:#fff}
        .nav-link i{font-size:14px}
        .nav-badge{position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:9px;min-width:16px;text-align:center}
        .nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .nav-user{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;background:#f8fafc;border-radius:24px;border:1px solid #e2e8f0;max-width:170px}
        .nav-avatar{width:28px;height:28px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
        .nav-uname{font-size:12.5px;font-weight:500;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .btn-logout{background:none;border:1px solid #fecaca;color:#dc2626;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;flex-shrink:0}
        .btn-logout:hover{background:#fef2f2}
        @media(max-width:1480px){.nav-uname{display:none}.nav-user{max-width:none}}
        :root { --primary: #3b82f6; --primary-dark: #1d4ed8; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; }
        .card { border-radius: 16px; border: 1px solid #e2e8f0; }
        .table th { font-weight: 600; color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        .badge-INVOICED { background: #fef3c7; color: #92400e; }
        .badge-PAID { background: #dcfce7; color: #166534; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; text-align: center; }
        .stat-card h4 { font-weight: 700; margin: 8px 0 0; }
        .filter-btn { border: 1px solid #e2e8f0; background: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; color: #64748b; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>
<div th:replace="~{fragments/sales-nav :: nav(active='payments')}"></div>

<div class="container-fluid py-4" style="max-width:1400px;">
    <h4 class="mb-4" style="font-weight:700;">Payment Tracking</h4>

    <div th:if="${successMessage}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span></div>
    <div th:if="${errorMessage}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-hourglass text-warning" style="font-size:1.5rem;"></i><h4 th:text="${pendingCount ?: 0}">8</h4><small class="text-muted">Pending</small></div></div>
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-currency-dollar text-warning" style="font-size:1.5rem;"></i><h4>ZMW <span th:text="${pendingAmount != null ? #numbers.formatDecimal(pendingAmount, 1, 'COMMA', 0, 'POINT') : '0'}">45000</span></h4><small class="text-muted">Pending Amount</small></div></div>
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-check-circle text-success" style="font-size:1.5rem;"></i><h4>ZMW <span th:text="${receivedThisMonth != null ? #numbers.formatDecimal(receivedThisMonth, 1, 'COMMA', 0, 'POINT') : '0'}">32000</span></h4><small class="text-muted">Received This Month</small></div></div>
    </div>

    <div class="mb-3">
        <a th:href="@{/sales/payments(status='PENDING')}" class="filter-btn" th:classappend="${status == 'PENDING'} ? ' active' : ''">Pending</a>
        <a th:href="@{/sales/payments(status='RECEIVED')}" class="filter-btn" th:classappend="${status == 'RECEIVED'} ? ' active' : ''">Received</a>
        <a th:href="@{/sales/payments(status='ALL')}" class="filter-btn" th:classappend="${status == 'ALL'} ? ' active' : ''">All</a>
    </div>

    <!-- Payments Table -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead><tr><th>Reference</th><th>Company</th><th>Amount</th><th>Invoiced</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td><code th:text="${p.invoiceNo != null ? p.invoiceNo : p.referenceNo}">INV-0001</code></td>

                    <td th:text="${p.companyName != null ? p.companyName : '-'}">Company</td>

                    <td>ZMW <span th:text="${p.totalAmount != null ? #numbers.formatDecimal(p.totalAmount,1,2) : '0.00'}">2750.00</span></td>

                    <td th:text="${p.invoicedAt != null ? p.invoicedAt.format(T(java.time.format.DateTimeFormatter).ofPattern('dd MMM')) : '-'}">15 Apr</td>

                    <td><span class="badge" th:classappend="${' badge-' + p.status}" th:text="${p.status}">INVOICED</span></td>

                    <td>
                        <a th:href="@{/sales/inquiries/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary me-1" title="Inquiry details">
                            <i class="bi bi-card-text"></i>
                        </a>
                        <a th:href="@{/sales/invoices/{id}/preview(id=${p.id})}" class="btn btn-sm btn-outline-primary" title="View invoice">
                            <i class="bi bi-eye"></i> View
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}"><td colspan="6" class="text-center text-muted py-5">No payments found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
