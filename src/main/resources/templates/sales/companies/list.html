<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Processing Companies - DairyCoop Sales</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        /* ── Shared Sales Topnav (keep identical on every sales/* page) ── */
        .topnav{background:linear-gradient(135deg,#0f2747 0%,#1b3a63 100%);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(15,39,71,0.45);gap:14px}
        .nav-brand{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
        .nav-logo{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex-shrink:0}
        .nav-title{font-size:17px;font-weight:700;color:#fff;white-space:nowrap}
        .nav-title span{color:rgba(255,255,255,0.9)}
        .nav-links{display:flex;align-items:center;gap:1px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0}
        .nav-links::-webkit-scrollbar{display:none}
        .nav-link{padding:8px 10px;border-radius:8px;color:rgba(255,255,255,0.85);text-decoration:none;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .2s;position:relative;white-space:nowrap;flex-shrink:0}
        .nav-link:hover{background:rgba(255,255,255,0.15);color:#fff}
        .nav-link.active{background:rgba(255,255,255,0.2);color:#fff}
        .nav-link i{font-size:14px}
        .nav-badge{position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:9px;min-width:16px;text-align:center}
        .nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .nav-user{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;background:#f8fafc;border-radius:24px;border:1px solid #e2e8f0;max-width:170px}
        .nav-avatar{width:28px;height:28px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
        .nav-uname{font-size:12.5px;font-weight:500;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .btn-logout{background:none;border:1px solid #fecaca;color:#dc2626;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;flex-shrink:0}
        .btn-logout:hover{background:#fef2f2}
        @media(max-width:1480px){.nav-uname{display:none}.nav-user{max-width:none}}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a}
        /* Main */
        .main{max-width:1300px;margin:0 auto;padding:32px}
        /* Alerts */
        .alert-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:13px 18px;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px}
        .alert-err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:13px 18px;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px}
        /* Stats */
        .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
        .stat-card{background:#fff;border-radius:14px;padding:22px;border:1px solid #e2e8f0}
        .stat-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
        .stat-label{font-size:12px;color:#64748b;margin-bottom:5px;font-weight:500}
        .stat-value{font-size:28px;font-weight:800;color:#0f172a}
        /* Company cards grid */
        .company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
        .company-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden;transition:all .2s}
        .company-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.08);transform:translateY(-2px)}
        .company-card-head{padding:22px 22px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-start;gap:14px}
        .company-avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
        .company-name{font-size:16px;font-weight:700;color:#0f172a;margin-bottom:4px}
        .company-status-active{display:inline-block;background:#f0fdf4;color:#16a34a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid #bbf7d0}
        .company-status-inactive{display:inline-block;background:#f9fafb;color:#9ca3af;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid #e5e7eb}
        .company-card-body{padding:16px 22px}
        .info-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;margin-bottom:8px}
        .info-row svg{flex-shrink:0;opacity:.6}
        .company-card-foot{padding:14px 22px;border-top:1px solid #f1f5f9;display:flex;gap:8px}
        .btn-portal{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer;transition:all .18s;flex:1;justify-content:center}
        .btn-portal:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(59,130,246,.35);color:#fff}
        .btn-edit{display:inline-flex;align-items:center;gap:5px;background:#f8fafc;color:#475569;border:1px solid #e2e8f0;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;font-family:inherit;cursor:pointer;transition:all .18s}
        .btn-edit:hover{background:#f1f5f9;color:#0f172a}
        .btn-toggle-off{display:inline-flex;align-items:center;gap:5px;background:none;color:#d97706;border:1px solid #fde68a;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
        .btn-toggle-off:hover{background:#fef3c7}
        .btn-toggle-on{display:inline-flex;align-items:center;gap:5px;background:none;color:#16a34a;border:1px solid #bbf7d0;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
        .btn-toggle-on:hover{background:#f0fdf4}
        .btn-add{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.3);transition:all .18s}
        .btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.4);color:#fff}
        .empty-state{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:64px 32px;text-align:center;color:#94a3b8}
        .portal-link{font-size:11px;font-family:'Courier New',monospace;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:3px 8px;color:#64748b;margin-top:4px;display:inline-block}
    </style>
</head>
<body>

<div th:replace="~{fragments/sales-nav :: nav(active='companies')}"></div>

<div class="main">

    <!-- Alerts -->
    <div class="alert-ok" th:if="${successMessage}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span th:text="${successMessage}">Success</span>
    </div>
    <div class="alert-err" th:if="${errorMessage}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px">
        <div>
            <div style="font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3b82f6;margin-bottom:5px">Sales Department</div>
            <h1 style="font-size:28px;font-weight:800;color:#0f172a;margin-bottom:4px">Processing Companies</h1>
        </div>
    </div>

    <!-- Stats -->
    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background:#eff6ff">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </div>
            <div class="stat-label">Total Companies</div>
            <div class="stat-value" th:text="${companies.size()}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#f0fdf4">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="stat-label">Active Partners</div>
            <div class="stat-value" style="color:#16a34a" th:text="${activeCount}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background:#f9fafb">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            </div>
            <div class="stat-label">Inactive</div>
            <div class="stat-value" style="color:#9ca3af" th:text="${inactiveCount}">0</div>
        </div>
    </div>

    <!-- Company cards -->
    <div class="company-grid" th:if="${companies != null and !#lists.isEmpty(companies)}">
        <div class="company-card" th:each="c : ${companies}">

            <div class="company-card-head">
                <div class="company-avatar"
                     th:text="${#strings.substring(c.name,0,1).toUpperCase()}"
                     th:style="${c.status == 'ACTIVE'} ? 'background:linear-gradient(135deg,#3b82f6,#1d4ed8)' : 'background:linear-gradient(135deg,#94a3b8,#64748b)'">A</div>
                <div style="flex:1;min-width:0">
                    <div class="company-name" th:text="${c.name}">Company Name</div>
                    <span class="company-status-active" th:if="${c.status == 'ACTIVE'}">● Active</span>
                    <span class="company-status-inactive" th:if="${c.status != 'ACTIVE'}">● Inactive</span>
                </div>
            </div>

            <div class="company-card-body">
                <div class="info-row" th:if="${c.contactPerson != null}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span th:text="${c.contactPerson}">Contact</span>
                </div>
                <div class="info-row" th:if="${c.phone != null}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.29 6.29l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    <span th:text="${c.phone}">Phone</span>
                </div>
                <div class="info-row" th:if="${c.email != null}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    <span th:text="${c.email}">Email</span>
                </div>
                <div class="info-row" th:if="${c.address != null}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span th:text="${c.address}">Address</span>
                </div>
            </div>

            <div class="company-card-foot">
                <form th:action="@{/sales/companies/{id}/toggle-status(id=${c.id})}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn-toggle-off" th:if="${c.status == 'ACTIVE'}" title="Deactivate">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                    </button>
                    <button type="submit" class="btn-toggle-on" th:if="${c.status != 'ACTIVE'}" title="Activate">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
<script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
