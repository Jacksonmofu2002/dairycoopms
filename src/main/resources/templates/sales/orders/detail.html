<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title th:text="'Order ' + (order.referenceNo != null ? order.referenceNo : '')">Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container" style="max-width:900px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Order <span th:text="${order.referenceNo}">INQ-2026-0001</span></h3>
        <div>
            <a th:href="@{/sales/orders}" class="btn btn-outline-secondary btn-sm">Back to Orders</a>
            <a th:if="${order.paymentStatus == 'RECEIVED'}"
               th:href="@{/sales/orders/{id}/invoice(id=${order.id})}"
               class="btn btn-primary btn-sm ms-2">View Invoice</a>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <div class="row mb-2">
                <div class="col-md-6">
                    <h6>Company</h6>
                    <div th:text="${order.processingCompany != null ? order.processingCompany.name : '-'}">Company Name</div>
                    <div class="text-muted" th:text="${order.processingCompany != null ? order.processingCompany.email : '-'}">email@company.com</div>
                </div>
                <div class="col-md-6 text-end">
                    <h6>Order Info</h6>
                    <div>Reference: <strong th:text="${order.referenceNo}">INQ-2026-0001</strong></div>
                    <div>Sale Date: <span th:text="${order.saleDate != null ? order.saleDate.format(T(java.time.format.DateTimeFormatter).ofPattern('dd MMM yyyy')) : '-'}">04-May-2026</span></div>
                    <div>Status: <span th:text="${order.paymentStatus}">PENDING</span></div>
                </div>
            </div>

            <hr/>

            <div class="row">
                <div class="col-md-4">
                    <div class="text-muted">Quantity</div>
                    <div th:text="${order.quantityLitres != null ? #numbers.formatDecimal(order.quantityLitres,1,2) + ' L' : '-'}">300.00 L</div>
                </div>
                <div class="col-md-4">
                    <div class="text-muted">Unit price</div>
                    <div th:text="${order.pricePerLitre != null ? 'ZMW ' + #numbers.formatDecimal(order.pricePerLitre,1,2) : '-'}">ZMW 20.00</div>
                </div>
                <div class="col-md-4">
                    <div class="text-muted">Total</div>
                    <div th:text="${order.totalRevenue != null ? 'ZMW ' + #numbers.formatDecimal(order.totalRevenue,1,2) : '-'}">ZMW 6,000.00</div>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/sales/orders/{id}/invoice(id=${order.id})}" class="btn btn-outline-primary btn-sm"
                   th:if="${order.paymentStatus == 'RECEIVED'}">Open Invoice</a>
                <span class="text-muted" th:if="${order.paymentStatus != 'RECEIVED'}">Invoice will be available after delivery/payment.</span>
            </div>

        </div>
    </div>
</div>
</body>
</html>
