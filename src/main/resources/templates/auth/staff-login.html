<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Staff Login — DairyCoop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#0f1117}
        .bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#f5f5f5 0%,#e8eef5 20%,#d0dce8 40%,#1a5a8a 60%,#0d3d5e 100%)}
        .bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,50 Q300,0 600,50 T1200,50 L1200,120 L0,120 Z" fill="%231a5a8a" opacity="0.8"/><path d="M0,60 Q300,20 600,60 T1200,60 L1200,120 L0,120 Z" fill="%230d3d5e" opacity="0.9"/></svg>') repeat-x;background-size:100% 100%}
        .card{position:relative;z-index:10;width:100%;max-width:390px;background:rgba(255,255,255,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:40px 36px}
        .brand{display:flex;align-items:center;gap:8px;margin-bottom:32px}
        .brand-dot{width:9px;height:9px;background:#0d3d5e;border-radius:50%}
        .brand-name{font-size:14px;font-weight:700;color:#0d3d5e;letter-spacing:.02em;text-shadow:0 2px 4px rgba(255,255,255,.3)}
        .card h2{font-size:24px;font-weight:800;color:#0d3d5e;margin-bottom:4px;text-shadow:0 2px 6px rgba(255,255,255,.4)}
        .card-sub{font-size:13px;color:#1a5a8a;margin-bottom:28px;text-shadow:0 1px 3px rgba(255,255,255,.2)}
        .alert-err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:11px 14px;border-radius:9px;margin-bottom:18px;font-size:13px;display:flex;align-items:center;gap:8px}
        .field{margin-bottom:16px}
        .flbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#0d3d5e;margin-bottom:6px;text-shadow:0 1px 2px rgba(255,255,255,.2)}
        .finp{width:100%;padding:12px 14px;border:1.5px solid rgba(13,61,94,.2);border-radius:10px;font-size:14px;font-family:inherit;color:#0d3d5e;background:rgba(255,255,255,.85);outline:none;transition:all .18s}
        .finp:focus{border-color:rgba(13,61,94,.5);background:rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(13,61,94,.1)}
        .finp::placeholder{color:rgba(13,61,94,.4);font-size:13px}
        /* Password wrapper with eye */
        .pw-wrap{position:relative}
        .pw-wrap .finp{padding-right:42px}
        .pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(13,61,94,.5);padding:4px;display:flex;align-items:center;transition:color .15s}
        .pw-eye:hover{color:#0d3d5e}
        .btn{width:100%;padding:13px;background:#0d3d5e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn:hover{background:#0a2a42;transform:translateY(-1px)}
    </style>
</head>
<body>
<div class="bg"></div>

<div class="card">
    <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-name">🌿 DairyCoop</div>
    </div>

    <h2>Staff Login</h2>
    <p class="card-sub">Accounts Officer · Sales · Collection Officer</p>

    <div class="alert-err" th:if="${param.error}">
        ⚠ Invalid email or password. Please try again.
    </div>
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:11px 14px;border-radius:9px;margin-bottom:18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px" th:if="${param.logout}">
        ✓ logged out successfully.
    </div>
    <div class="alert-err" th:if="${param.wrongportal}">
        ⚠ This account does not belong to this portal. Please use the correct login page.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label class="flbl" for="username">Email Address</label>
            <input type="email" id="username" name="email" class="finp"
                   placeholder="your@email.com" required autofocus/>
        </div>

        <div class="field">
            <label class="flbl" for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password" class="finp"
                       placeholder="Enter your password" required/>
                <button type="button" class="pw-eye" onclick="togglePw()" tabindex="-1" aria-label="Show password">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In
        </button>
    </form>
</div>

<script>
    function togglePw() {
        var inp = document.getElementById('password');
        var icon = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            inp.type = 'password';
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    }
</script>
</body>
</html>
