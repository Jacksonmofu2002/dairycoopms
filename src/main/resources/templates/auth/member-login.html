<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Member Sign In - DairyCoop</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Sora',sans-serif;
            height:100vh;
            overflow:hidden;
            display:grid;
            grid-template-columns:1fr 1fr;
            background:#fff;
        }

        /* LEFT - full image panel */
        .img-panel{
            position:relative;
            overflow:hidden;
            background:#0a2e12;
        }
        .img-panel img{
            width:100%;height:100%;
            object-fit:cover;
            opacity:0.55;
            display:block;
        }
        .img-overlay{
            position:absolute;
            inset:0;
            background:linear-gradient(to bottom, rgba(10,46,18,0.4) 0%, rgba(10,46,18,0.75) 100%);
        }
        .img-content{
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:32px;
            text-align:center;
        }
        .img-tag{
            display:inline-block;
            background:rgba(245,166,35,0.9);
            color:#0a2e12;
            font-size:10px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:.15em;
            padding:5px 12px;
            border-radius:4px;
            margin-bottom:16px;
        }
        .img-title{
            font-family:'Playfair Display',serif;
            font-size:28px;
            font-weight:600;
            color:#fff;
            line-height:1.2;
            margin-bottom:12px;
        }
        .img-title em{font-style:italic;color:#f5a623}
        .img-desc{font-size:14px;color:rgba(255,255,255,0.65);line-height:1.7;max-width:380px}

        /* RIGHT - form panel */
        .form-panel{
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:24px 40px;overflow-y:auto;
            background:#fff;
        }
        .form-logo{
            display:flex;align-items:center;gap:10px;
            margin-bottom:16px;
        }
        .form-logo-icon{
            width:32px;height:32px;
            background:#0a2e12;
            border-radius:9px;
            display:flex;align-items:center;justify-content:center;
        }
        .form-logo-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:#111}
        .form-logo-tag{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.1em}

        .form-eyebrow{font-size:22px;font-weight:700;color:#0a2e12;margin-bottom:20px}
        .form-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:#111;line-height:1.2;margin-bottom:4px}
        .form-sub{font-size:13px;color:#6b7280;margin-bottom:16px}
        .alert-err{background:#fef2f2;border-left:3px solid #dc2626;color:#991b1b;padding:9px 13px;border-radius:0 8px 8px 0;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:10px}

        .fgrp{margin-bottom:12px}
        .flbl{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:7px}
        .finp{
            width:100%;
            padding:11px 14px;
            border:1.5px solid #e5e7eb;
            border-radius:10px;
            font-size:14px;font-family:inherit;
            color:#111;background:#fafafa;
            outline:none;transition:all .2s;
        }
        .finp:focus{border-color:#16a34a;background:#fff;box-shadow:0 0 0 3px rgba(22,163,74,0.08)}
        .finp::placeholder{color:#9ca3af}

        .btn-submit{
            width:100%;padding:12px;
            background:#0a2e12;color:#fff;
            border:none;border-radius:10px;
            font-size:14.5px;font-weight:600;
            font-family:inherit;cursor:pointer;
            transition:all .2s;letter-spacing:.02em;
        }
        .btn-submit:hover{background:#0f4a1e;transform:translateY(-1px);box-shadow:0 8px 24px rgba(10,46,18,0.3)}

        .form-divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:#d1d5db;font-size:12px}
        .form-divider::before,.form-divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
        .form-foot{text-align:center;font-size:13.5px;color:#6b7280}
        .form-foot a{color:#16a34a;font-weight:600;text-decoration:none}
        .form-foot a:hover{text-decoration:underline}

        @media(max-width:768px){
            body{grid-template-columns:1fr}
            .img-panel{display:none}
            .form-panel{padding:40px 28px}
        }

        /* Password eye toggle */
        .pw-wrap{position:relative}
        .pw-wrap .finp{padding-right:42px}
        .pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9ca3af;padding:4px;display:flex;align-items:center;transition:color .15s}
        .pw-eye:hover{color:#374151}
    </style>
</head>
<body>

<!-- Left: full farm image -->
<div class="img-panel">
    <img src="https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=1200&q=80" alt="Farm"/>
    <div class="img-overlay"></div>
    <div class="img-content">
        <div class="img-title">Your farm,<br/><em>your future.</em></div>
    </div>
</div>

<!-- Right: login form -->
<div class="form-panel">
    <div class="form-logo">
        <div class="form-logo-icon">
            <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
                <ellipse cx="16" cy="19" rx="9" ry="6" fill="#4CAF50" opacity="0.7"/>
                <circle cx="10" cy="15" r="4" fill="#fff" opacity="0.9"/>
                <circle cx="22" cy="15" r="4" fill="#fff" opacity="0.9"/>
                <ellipse cx="16" cy="12" rx="6" ry="5" fill="#fff"/>
                <circle cx="13" cy="11" r="1" fill="#2d6a2d"/>
                <circle cx="19" cy="11" r="1" fill="#2d6a2d"/>
            </svg>
        </div>
        <div>
            <div class="form-logo-name">DairyCoop</div>
        </div>
    </div>

    <div class="form-eyebrow">Member Login</div>

    <div class="alert-err" th:if="${param.wrongportal}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Please use the correct portal for your role.
    </div>
    <div class="alert-err" th:if="${param.error}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Invalid email or password.
    </div>
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:11px 14px;border-radius:9px;margin-bottom:18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px" th:if="${param.logout}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>
        Signed out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="fgrp">
            <label class="flbl" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="finp"
                   placeholder="your@email.com" required autocomplete="email" autofocus/>
        </div>
        <div class="fgrp">
            <label class="flbl" for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password" class="finp"
                       placeholder="Enter your password" required autocomplete="current-password"/>
                <button type="button" class="pw-eye" onclick="togglePw()" tabindex="-1" aria-label="Show password">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="form-divider">or</div>
    <div class="form-foot">New member? <a th:href="@{/member/register}">Create your account</a></div>
</div>

<script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

<script>
    function togglePw() {
        var inp = document.getElementById('password');
        var icon = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            inp.type = 'password';
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    }
</script>
</body>
</html>
