<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - DairyCoop MS</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fraunces:ital,wght@0,300;0,600;1,400&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}

        /*  STATIC BACKGROUND - cow3.jpg  */
        .background{
            position:fixed;
            inset:0;
            z-index:0;
            background-image:url('/images/cow3.jpg');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        /* Overlay on background */
        .background::after{
            content:'';
            position:absolute;inset:0;
            background:linear-gradient(135deg,rgba(4,16,8,.75) 0%,rgba(8,24,12,.55) 50%,rgba(4,12,6,.70) 100%);
            z-index:1;
        }

        /*  LOGIN CARD  */
        .login-card{position:relative;z-index:10;background:rgba(255,255,255,.13);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:44px 48px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}

        .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px}
        .brand-icon{width:38px;height:38px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;display:flex;align-items:center;justify-content:center}
        .brand-name{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#fff}
        .brand-tag{font-size:9px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.12em;display:block;margin-top:1px}

        .card-title{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:#fff;margin-bottom:4px}
        .card-sub{font-size:13.5px;color:rgba(255,255,255,.65);margin-bottom:28px}

        .alert-err{background:#fef2f2;border-left:3px solid #dc2626;color:#991b1b;padding:11px 14px;border-radius:0 8px 8px 0;font-size:13px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
        .fgrp{margin-bottom:18px}
        .flbl{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.8);margin-bottom:7px}
        .finp{width:100%;padding:13px 16px;border:1.5px solid rgba(255,255,255,.25);border-radius:10px;font-size:14px;font-family:inherit;color:#fff;background:rgba(255,255,255,.12);outline:none;transition:all .2s}
        .finp:focus{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.2);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
        .finp::placeholder{color:rgba(255,255,255,.4)}

        .btn-submit{width:100%;padding:14px;background:rgba(255,255,255,.95);color:#0a2e12;border:none;border-radius:10px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;letter-spacing:.02em;margin-top:4px}
        .btn-submit:hover{background:#fff;transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,0,0,.25)}

        /* Company Portal Link */

        /* Password eye toggle */
        .pw-wrap{position:relative}
        .pw-wrap .finp{padding-right:42px}
        .pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.45);padding:4px;display:flex;align-items:center;transition:color .15s}
        .pw-eye:hover{color:rgba(255,255,255,.9)}
    </style>
</head>
<body>

<!--  STATIC BACKGROUND - cow3.jpg  -->
<div class="background"></div>

<!--  LOGIN CARD  -->
<div class="login-card">
    <div class="brand">
        <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
                <ellipse cx="16" cy="19" rx="9" ry="6" fill="#4CAF50" opacity="0.7"/>
                <circle cx="10" cy="15" r="4" fill="#fff" opacity="0.9"/>
                <circle cx="22" cy="15" r="4" fill="#fff" opacity="0.9"/>
                <ellipse cx="16" cy="12" rx="6" ry="5" fill="#fff"/>
                <circle cx="13" cy="11" r="1" fill="#2d6a2d"/>
                <circle cx="19" cy="11" r="1" fill="#2d6a2d"/>
            </svg>
        </div>
        <div>
            <div class="brand-name">DairyCoop</div>
            <span class="brand-tag">Management System</span>
        </div>
    </div>

    <div class="card-title">Welcome back</div>
    <div class="card-sub">Administrator access only</div>

    <div class="alert-err" th:if="${param.error}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Invalid email or password.
    </div>
    <div class="alert-ok" th:if="${param.logout}">
        ✓ You have been logged out successfully.
    </div>
    <div class="alert-err" th:if="${param.wrongportal}">
        ⚠ This account does not belong to this portal. Please use the correct login page.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="fgrp">
            <label class="flbl" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="finp"
                   placeholder="admin@dairycoop.com" required autocomplete="email" autofocus/>
        </div>
        <div class="fgrp">
            <label class="flbl" for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password" class="finp"
                       placeholder="Enter your password" required autocomplete="current-password"/>
                <button type="button" class="pw-eye" onclick="togglePw()" tabindex="-1" aria-label="Show password">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
    </form>

</div>

<!-- Company Portal Link -->
<script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

<script>
    function togglePw() {
        var inp = document.getElementById('password');
        var icon = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            inp.type = 'password';
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    }
</script>
</body>
</html>
