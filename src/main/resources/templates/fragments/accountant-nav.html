<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  DairyCoop Finance — Sidebar + Topbar fragment.
  Include with:
      <div th:replace="~{fragments/accountant-nav :: nav(active='dashboard', pageTitle='Overview')}"></div>

  This fragment is self-contained: it outputs <aside class="sb"> and
  <div class="sb-topbar"> only.

  The template then wraps its OWN content in:
      <div class="sb-page"> ... </div>

  CSS (accountant-sidebar.css) makes the sidebar position:fixed and the
  topbar position:fixed so the sb-page just needs margin-left + padding-top.
-->
<div th:fragment="nav(active, pageTitle)">

    <!-- ── Sidebar (fixed left) ───────────────────────────────────── -->
    <aside class="sb">

        <a class="sb-brand" th:href="@{/accountant/dashboard}">
            <div class="sb-brand-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div>
                <div class="sb-brand-name">DairyCoop</div>
                <span class="sb-brand-sub">Finance</span>
            </div>
        </a>

        <nav class="sb-nav">
            <div class="sb-section">Main</div>
            <a th:href="@{/accountant/dashboard}"
               th:classappend="${active == 'dashboard'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
                Overview
            </a>

            <div class="sb-section">Lending</div>
            <a th:href="@{/accountant/loans}"
               th:classappend="${active == 'loans'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg>
                Loan Management
                <span class="sb-badge" data-live-badge="pendingLoans"
                      th:style="${pendingLoansCount != null and pendingLoansCount > 0} ? '' : 'display:none'"
                      th:text="${pendingLoansCount ?: 0}"></span>
            </a>
            <a th:href="@{/accountant/disbursements}"
               th:classappend="${active == 'disbursements'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
                Disbursements
            </a>

            <div class="sb-section">Payroll</div>
            <a th:href="@{/accountant/salaries}"
               th:classappend="${active == 'salaries'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Pay Salaries
            </a>
            <a th:href="@{/accountant/deductions}"
               th:classappend="${active == 'deductions'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                Deductions
            </a>

            <div class="sb-section">Revenue</div>
            <a th:href="@{/accountant/milk-payments}"
               th:classappend="${active == 'milk-payments'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
                Milk Payments
                <span class="sb-badge" data-live-badge="pendingPayments"
                      th:style="${invoicedCount != null and invoicedCount > 0} ? '' : 'display:none'"
                      th:text="${invoicedCount ?: 0}"></span>
            </a>
            <a th:href="@{/accountant/receipts}"
               th:classappend="${active == 'receipts'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                Receipts
                <span class="sb-badge" data-live-badge="unsentReceipts"
                      th:style="${unsentReceipts != null and unsentReceipts > 0} ? '' : 'display:none'"
                      th:text="${unsentReceipts ?: 0}"></span>
            </a>

            <div class="sb-section">Analytics</div>
            <a th:href="@{/accountant/reports}"
               th:classappend="${active == 'reports'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                Reports
            </a>
            <a th:href="@{/accountant/financial-overview}"
               th:classappend="${active == 'financial-overview'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                Financial Overview
            </a>

            <div class="sb-section">System</div>
            <a th:href="@{/accountant/cofa-reconciliation}"
               th:classappend="${active == 'cofa'} ? ' active' : ''"
               class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                COFA Reconciliation
            </a>
            <a th:href="@{/account/password}" class="sb-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Change Password
            </a>
        </nav>

        <div class="sb-divider"></div>

        <div class="sb-user">
            <div class="sb-user-inner">
                <div class="sb-av"
                     th:text="${user != null ? #strings.substring(user.fullName,0,1).toUpperCase() : 'A'}">A</div>
                <div style="min-width:0;flex:1">
                    <div class="sb-uname"
                         th:text="${user != null ? user.fullName : 'Officer'}">Name</div>
                    <div class="sb-urole">Accounts</div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="sb-logout" title="Sign out">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

    </aside>

    <!-- ── Topbar (fixed top, left of sidebar) ────────────────────── -->
    <div class="sb-topbar">
        <div class="sb-crumb">
            <span>Finance</span>
            <span class="sb-crumb-sep">›</span>
            <span class="sb-crumb-page" th:text="${pageTitle}">Page</span>
        </div>
        <div class="sb-topbar-right">
            <div id="sbDate" class="sb-topbar-date"></div>
            <div class="sb-sep"></div>
            <div class="sb-topbar-user" th:if="${user != null}">
                <div class="sb-topbar-av"
                     th:text="${#strings.substring(user.fullName,0,1).toUpperCase()}">A</div>
                <div>
                    <div class="sb-topbar-name" th:text="${user.fullName}">Name</div>
                    <div class="sb-topbar-role">Accounts Officer</div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="sb-topbar-btn danger" title="Sign out">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        (function(){
            // ── Date in topbar ───────────────────────────────────────────
            var el = document.getElementById('sbDate');
            if (el) el.textContent = new Date().toLocaleDateString('en-GB',
                {day:'2-digit', month:'short', year:'numeric'});

            // ── Ripple on nav links ──────────────────────────────────────
            document.querySelectorAll('.sb-item').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    var r = document.createElement('span');
                    r.className = 'sb-ripple';
                    var rect = link.getBoundingClientRect();
                    var size = Math.max(rect.width, rect.height);
                    r.style.cssText = 'width:' + size + 'px;height:' + size + 'px;'
                        + 'left:' + (e.clientX - rect.left - size/2) + 'px;'
                        + 'top:'  + (e.clientY - rect.top  - size/2) + 'px;';
                    link.appendChild(r);
                    setTimeout(function(){ r.remove(); }, 500);
                });
            });

            // ── Fade page out before navigating ─────────────────────────
            document.querySelectorAll('.sb-item[href]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    var href = link.getAttribute('href');
                    if (!href || href.startsWith('#') || href.startsWith('javascript')) return;
                    e.preventDefault();
                    var page = document.querySelector('.sb-page');
                    if (page) {
                        page.style.transition = 'opacity .15s ease, transform .15s ease';
                        page.style.opacity = '0';
                        page.style.transform = 'translateY(-6px)';
                    }
                    setTimeout(function(){ window.location.href = href; }, 150);
                });
            });
        })();
    </script>



    <script th:src="@{/js/dairycoop-live.js}"></script>
</div><!-- end th:fragment -->
</body>
</html>
