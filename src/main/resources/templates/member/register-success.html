<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Account Created - DairyCoop</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Fraunces:wght@300;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;background:#0a1628;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{background:#fff;border-radius:24px;padding:56px 48px;max-width:460px;width:100%;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,0.4)}
        .icon{width:80px;height:80px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
        h1{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:#111827;margin-bottom:12px}
        p{font-size:14px;color:#6b7280;line-height:1.8;margin-bottom:8px}
        .btn{display:inline-block;margin-top:32px;padding:14px 40px;background:linear-gradient(135deg,#1a6b2e,#2d8a42);color:#fff;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;transition:all .2s}
        .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(26,107,46,0.35);color:#fff}
    </style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
    </div>
    <h1>Account created!</h1>
    <p>Welcome to DairyCoop. Your account is ready.</p>
    <p>Sign in now and complete your membership profile. Your profile will be reviewed and approved by the admin before you can access all features.</p>
    <a th:href="@{/login}" class="btn">Sign in to your account</a>
</div>
</body>
</html>
