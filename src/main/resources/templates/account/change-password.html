<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password - DairyCoop MS</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}"/>
  <style>
        @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:wght@600&display=swap");
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:"Plus Jakarta Sans",sans-serif;min-height:100vh;background:#f0f2f5;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.1);width:100%;max-width:460px;overflow:hidden}
        .card-head{background:linear-gradient(135deg,#0d3d1a,#1a6b2e);padding:28px 32px}
        .card-head h2{font-family:"Fraunces",serif;font-size:22px;font-weight:600;color:#fff;margin-bottom:4px}
        .card-head p{font-size:13px;color:rgba(255,255,255,0.6)}
        .card-body{padding:28px 32px}
        .flbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#374151;margin-bottom:7px}
        .finp{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;color:#111827;background:#f9fafb;outline:none;transition:all .2s}
        .finp:focus{border-color:#1a6b2e;background:#fff;box-shadow:0 0 0 3px rgba(26,107,46,.1)}
        .finp::placeholder{color:#9ca3af}
        .fgrp{margin-bottom:18px}
        .btn-submit{width:100%;padding:12px;background:#1a6b2e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
        .btn-submit:hover{background:#0f4a1e;transform:translateY(-1px)}
        .btn-skip{display:block;text-align:center;margin-top:14px;font-size:13px;color:#6b7280;text-decoration:none}
        .btn-skip:hover{color:#111827}
        .alert-err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 16px;border-radius:10px;font-size:13.5px;display:flex;align-items:center;gap:10px;margin-bottom:20px}
        .pw-meter{height:4px;border-radius:2px;background:#e5e7eb;margin-top:6px;overflow:hidden}
        .pw-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
        .hint{font-size:11.5px;color:#9ca3af;margin-top:5px}
    </style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <h2>Change your password</h2>
    <p>You are currently using a temporary password. Set a new one below.</p>
  </div>
  <div class="card-body">

    <div class="alert-err" th:if="${errorMessage != null}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span th:text="${errorMessage}">Error</span>
    </div>

    <form th:action="@{/account/password}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="fgrp">
        <label class="flbl" for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" name="currentPassword" class="finp"
               placeholder="Your temporary password" required/>
      </div>

      <div class="fgrp">
        <label class="flbl" for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" class="finp"
               placeholder="Min 5 characters"
               oninput="updateMeter(this.value)" required/>
        <div class="pw-meter"><div class="pw-bar" id="pwBar"></div></div>
        <div class="hint">Minimum 5 characters</div>
      </div>

      <div class="fgrp">
        <label class="flbl" for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="finp"
               placeholder="Repeat new password" required/>
      </div>

      <button type="submit" class="btn-submit">Change Password</button>
    </form>

    <!-- Skip option - stay on temp password and go to dashboard -->
    <form th:action="@{/account/dismiss-banner}" method="post" style="margin-top:12px">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn-skip">Skip for now - continue to dashboard</button>
    </form>

  </div>
</div>
<script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script>
    function updateMeter(pw) {
        var bar=document.getElementById('pwBar');
        var len=pw.length;
        if(len==0){bar.style.width='0';return;}
        if(len<5){bar.style.width='25%';bar.style.background='#ef4444';}
        else if(len<7){bar.style.width='50%';bar.style.background='#f59e0b';}
        else if(len<9){bar.style.width='75%';bar.style.background='#22c55e';}
        else{bar.style.width='100%';bar.style.background='#16a34a';}
    }
</script>
</body>
</html>
