<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Company Portal — DairyCoop</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#f4f6f4 0%,#e8f5e9 100%);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

        /* Top bar with enhanced styling */
        .topbar{background:linear-gradient(135deg,#fff 0%,#f9faf9 100%);border-bottom:2px solid rgba(26,107,46,.08);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.04);position:sticky;top:0;z-index:50;animation:slideDown .6s ease-out}

        @keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

        .logo{display:flex;align-items:center;gap:9px;text-decoration:none;transition:transform .3s}
        .logo:hover{transform:scale(1.05)}
        .logo-dot{width:12px;height:12px;background:linear-gradient(135deg,#1a6b2e,#2d8659);border-radius:50%;box-shadow:0 0 12px rgba(26,107,46,.3);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(26,107,46,.3)}50%{box-shadow:0 0 20px rgba(26,107,46,.6)}}
        .logo-text{font-size:16px;font-weight:700;color:#1a2b1a;background:linear-gradient(135deg,#1a6b2e,#2d8659);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

        .topbar-right{display:flex;align-items:center;gap:12px}
        .login-link{font-size:12px;color:#9ca3af;text-decoration:none;transition:all .3s;padding:6px 12px;border-radius:6px}
        .login-link:hover{color:#1a6b2e;background:rgba(26,107,46,.08)}

        .btn-reg{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#1a6b2e,#2d8659);color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:700;text-decoration:none;transition:all .3s;border:2px solid transparent;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(26,107,46,.2)}
        .btn-reg::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:rgba(255,255,255,.2);transition:left .3s}
        .btn-reg:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,107,46,.35)}
        .btn-reg:hover::before{left:100%}

        /* Main */
        .main{max-width:1200px;margin:0 auto;padding:50px 28px;flex:1;animation:fadeIn .7s ease-out}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

        /* Hero section */
        .hero{margin-bottom:50px;text-align:center;animation:zoomIn .8s ease-out}
        @keyframes zoomIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
        .hero h1{font-size:36px;font-weight:700;color:#1a2b1a;margin-bottom:12px;background:linear-gradient(135deg,#1a6b2e,#2d8659);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{font-size:16px;color:#6b7280;max-width:600px;margin:0 auto 30px;line-height:1.6}

        /* Alerts */
        .alert-ok,.alert-err,.alert-warn{padding:14px 18px;border-radius:12px;margin-bottom:24px;font-size:14px;display:flex;align-items:center;gap:12px;animation:slideInDown .5s ease-out;box-shadow:0 4px 12px rgba(0,0,0,.08)}
        @keyframes slideInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
        .alert-ok{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;color:#166534}
        .alert-err{background:linear-gradient(135deg,#fef2f2,#fee2e2);border:1.5px solid #fca5a5;color:#dc2626}
        .alert-warn{background:linear-gradient(135deg,#fffbeb,#fef08a);border:1.5px solid #fcd34d;color:#92400e}

        /* Page header */
        .pg-head{margin-bottom:32px}
        .pg-head h1{font-size:28px;font-weight:700;color:#1a2b1a;margin-bottom:8px}
        .pg-head p{font-size:15px;color:#6b7280}

        /* Search */
        .search-wrapper{position:relative;margin-bottom:28px;animation:slideUp .6s ease-out}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .search{width:100%;max-width:500px;padding:14px 18px 14px 42px;border:2px solid #e5e7e5;border-radius:12px;font-size:14px;font-family:inherit;outline:none;background:#fff;transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
        .search:focus{border-color:#1a6b2e;background:#f9faf9;box-shadow:0 4px 16px rgba(26,107,46,.12)}
        .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}

        /* Stats */
        .stats{display:flex;gap:20px;align-items:center;margin-bottom:28px;flex-wrap:wrap;animation:fadeIn .8s ease-out .2s both}
        .stat{display:flex;align-items:center;gap:8px;font-size:14px;color:#6b7280;background:rgba(255,255,255,.6);padding:10px 16px;border-radius:10px;border:1.5px solid rgba(26,107,46,.1);transition:all .3s}
        .stat:hover{background:#fff;border-color:#1a6b2e;color:#1a6b2e}
        .stat strong{color:#1a2b1a;font-weight:700;font-size:16px}
        .divider{width:1px;height:16px;background:#e5e7e5}

        /* Empty */
        .empty{background:linear-gradient(135deg,#fff 0%,#f9faf9 100%);border:2px dashed #e5e7e5;border-radius:16px;padding:60px 24px;text-align:center;color:#9ca3af;animation:slideUp .7s ease-out;box-shadow:0 4px 12px rgba(0,0,0,.04)}
        .empty-icon{font-size:48px;margin-bottom:16px;color:#d1d5db;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
        .empty h3{font-size:18px;font-weight:700;color:#6b7280;margin-bottom:8px}
        .empty p{font-size:14px;margin-bottom:24px;color:#9ca3af}

        /* Company Grid - 3 Column Layout */
        .co-list{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px}

        /* Dynamic color schemes */
        .co-row{
            background:#fff;
            border-radius:16px;
            overflow:hidden;
            text-decoration:none;
            color:inherit;
            transition:all .4s cubic-bezier(.34,.1,.68,1);
            position:relative;
            display:flex;
            flex-direction:column;
            height:100%;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
            animation:popIn .5s ease-out both;
        }

        @keyframes popIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

        .co-row:hover{
            box-shadow:0 16px 32px rgba(0,0,0,.15);
            transform:translateY(-8px);
        }

        /* Color variants - 12 unique colors */
        .co-row.c1 .co-banner{background:linear-gradient(135deg,#1a6b2e 0%,#2d8659 100%)}
        .co-row.c2 .co-banner{background:linear-gradient(135deg,#0369a1 0%,#0284c7 100%)}
        .co-row.c3 .co-banner{background:linear-gradient(135deg,#d97706 0%,#f59e0b 100%)}
        .co-row.c4 .co-banner{background:linear-gradient(135deg,#7c3aed 0%,#8b5cf6 100%)}
        .co-row.c5 .co-banner{background:linear-gradient(135deg,#ec4899 0%,#f472b6 100%)}
        .co-row.c6 .co-banner{background:linear-gradient(135deg,#06b6d4 0%,#22d3ee 100%)}
        .co-row.c7 .co-banner{background:linear-gradient(135deg,#059669 0%,#10b981 100%)}
        .co-row.c8 .co-banner{background:linear-gradient(135deg,#dc2626 0%,#ef4444 100%)}
        .co-row.c9 .co-banner{background:linear-gradient(135deg,#7f1d1d 0%,#b91c1c 100%)}
        .co-row.c10 .co-banner{background:linear-gradient(135deg,#0f766e 0%,#14b8a6 100%)}
        .co-row.c11 .co-banner{background:linear-gradient(135deg,#3b82f6 0%,#60a5fa 100%)}
        .co-row.c12 .co-banner{background:linear-gradient(135deg,#f97316 0%,#fb923c 100%)}

        /* Banner with gradient */
        .co-banner{
            height:120px;
            display:flex;
            align-items:flex-end;
            justify-content:flex-start;
            padding:16px;
            position:relative;
            overflow:hidden;
        }

        .co-banner::before{
            content:'';
            position:absolute;
            top:0;
            right:-50px;
            width:150px;
            height:150px;
            background:rgba(255,255,255,.1);
            border-radius:50%;
            animation:float-circle 6s ease-in-out infinite;
        }

        @keyframes float-circle{
            0%,100%{transform:translate(0,0)}
            25%{transform:translate(-20px,20px)}
            50%{transform:translate(-40px,0)}
            75%{transform:translate(-20px,-20px)}
        }

        .co-avatar{
            width:56px;
            height:56px;
            border-radius:12px;
            background:rgba(255,255,255,.95);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            font-weight:800;
            color:#1a2b1a;
            box-shadow:0 4px 16px rgba(0,0,0,.15);
            position:relative;
            z-index:1;
            border:3px solid #fff;
        }

        /* Content area */
        .co-content{padding:18px;flex:1;display:flex;flex-direction:column;gap:12px}

        .co-name{
            font-size:16px;
            font-weight:700;
            color:#1a2b1a;
            line-height:1.3;
        }

        .co-meta-info{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .co-meta{
            font-size:13px;
            color:#6b7280;
            display:flex;
            align-items:center;
            gap:6px;
            line-height:1.4;
        }

        .co-meta i{font-size:11px}

        .co-footer{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding-top:12px;
            border-top:1px solid #f3f4f6;
            margin-top:auto;
        }

        .co-badge{
            display:inline-flex;
            align-items:center;
            gap:5px;
            font-size:11px;
            font-weight:700;
            padding:5px 10px;
            border-radius:20px;
            background:#f0fdf4;
            color:#16a34a;
            border:1px solid #86efac;
        }

        .co-arrow{
            color:#9ca3af;
            font-size:16px;
            transition:all .3s;
        }

        .co-row:hover .co-arrow{
            color:#1a6b2e;
            transform:translateX(4px);
        }

        /* Responsive */
        @media(max-width:1024px){
            .co-list{grid-template-columns:repeat(2,1fr);gap:18px}
        }

        @media(max-width:768px){
            .topbar{padding:0 16px;height:56px}
            .main{padding:30px 16px}
            .hero h1{font-size:28px}
            .hero p{font-size:14px}
            .co-list{grid-template-columns:1fr;gap:14px}
            .pg-head h1{font-size:24px}
            .search{max-width:100%}
        }

        @media(max-width:480px){
            .topbar-right{flex-direction:column;width:100%;gap:8px}
            .btn-reg{width:100%;justify-content:center}
        }

        /* Stagger animation */
        .co-row{animation-delay:calc(var(--index, 0) * 0.08s)}
    </style>
</head>
<body>

<!-- Top Navigation Bar -->
<div class="topbar">
    <a class="logo" href="/portal">
        <div class="logo-dot"></div>
        <div class="logo-text">🥛 DairyCoop</div>
    </a>
    <div class="topbar-right">
        <a class="login-link" href="/login">Staff / Admin Login →</a>
        <a class="btn-reg" th:href="@{/portal/register}"><i class="fas fa-plus"></i> Register Company</a>
    </div>
</div>

<div class="main">

    <!-- Alerts -->
    <div class="alert-ok" th:if="${successMessage}">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}">Success</span>
    </div>
    <div class="alert-err" th:if="${errorMessage}">
        <i class="fas fa-times-circle"></i>
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- Hero Section -->
    <div class="hero" th:if="${companies != null and !#lists.isEmpty(companies)}">
        <h1><i class="fas fa-store"></i> Our Partners</h1>
    </div>

    <!-- Stats -->
    <div class="stats" th:if="${companies != null and !#lists.isEmpty(companies)}">
        <div class="stat"><i class="fas fa-building"></i> <strong th:text="${companies.size()}">0</strong> Companies</div>
        <div class="divider"></div>
        <div class="stat"><i class="fas fa-check-circle"></i> All <strong>Verified</strong> & <strong>Active</strong></div>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper" th:if="${companies != null and companies.size() > 4}">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="search" id="searchInput"
               placeholder="Search company name..."
               oninput="filterCompanies(this.value)"/>
    </div>

    <!-- Empty State -->
    <div class="empty" th:if="${companies == null or #lists.isEmpty(companies)}">
        <div class="empty-icon"><i class="fas fa-inbox"></i></div>
        <h3>No companies registered yet</h3>
        <p>Be the first to register and start purchasing milk from the cooperative.</p>
        <a th:href="@{/portal/register}" class="btn-reg"><i class="fas fa-rocket"></i> Register Your Company</a>
    </div>

    <!-- Company Grid - 3 Columns -->
    <div class="co-list" th:if="${companies != null and !#lists.isEmpty(companies)}" id="coList">
        <a th:each="c,iter : ${companies}"
           th:href="@{/portal/company/{id}(id=${c.id})}"
           th:classappend="'c' + ((${iter.index} % 12) + 1)"
           class="co-row"
           th:data-name="${c.name.toLowerCase()}"
           th:style="${'--index: ' + iter.index}">

            <!-- Gradient Banner -->
            <div class="co-banner">
                <div class="co-avatar" th:text="${#strings.substring(c.name,0,1).toUpperCase()}">A</div>
            </div>

            <!-- Content -->
            <div class="co-content">
                <div class="co-name" th:text="${c.name}">Company Name</div>

                <div class="co-meta-info">
                    <div class="co-meta" th:if="${c.contactPerson != null}">
                        <i class="fas fa-user"></i>
                        <span th:text="${c.contactPerson}">Contact Person</span>
                    </div>
                    <div class="co-meta" th:if="${c.phone != null}">
                        <i class="fas fa-phone"></i>
                        <span th:text="${c.phone}">Phone</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="co-footer">
                <div class="co-badge">
                    <i class="fas fa-circle"></i>
                    Active
                </div>
                <div class="co-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </div>
        </a>
    </div>

</div>

<script>
    // Enhanced search with real-time filtering
    function filterCompanies(q) {
        q = q.toLowerCase().trim();
        const items = document.querySelectorAll('#coList .co-row');
        let visibleCount = 0;

        items.forEach(function(row) {
            const name = (row.dataset.name || '').toLowerCase();
            const matches = !q || name.includes(q);
            row.style.display = matches ? '' : 'none';
            if (matches) visibleCount++;
        });
    }

    // Smooth animations on load
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.co-row').forEach((el, idx) => {
            el.style.setProperty('--index', idx);
        });
    });
</script>
</body>
</html>
